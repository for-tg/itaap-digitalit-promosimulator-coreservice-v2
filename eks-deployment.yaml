apiVersion: apps/v1
kind: Deployment
metadata:
  name: itaap-digitalit-promosimulator-coreservice
  namespace: {{deployNamespace}}
  labels:
    app: itaap-digitalit-promosimulator-coreservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: itaap-digitalit-promosimulator-coreservice
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: itaap-digitalit-promosimulator-coreservice
    spec:
      containers:
        - name: itaap-digitalit-promosimulator-coreservice-container
          image: >-
            762168133611.dkr.ecr.eu-west-1.amazonaws.com/itaap/digitalit/itaap-digitalit-promosimulator-coreservice:{{imageTagName}}
          ports:
            - containerPort: 9000
              protocol: TCP
          env:
            - name: LOG_LEVEL_APP
              valueFrom:
                configMapKeyRef:
                  name: itaap-digitalit-promosimulator-coreservice
                  key: LOG_LEVEL_APP
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: itaap-digitalit-promosimulator-coreservice
                  key: APP_ENV
            - name: APP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: itaap-digitalit-promosimulator-coreservice
                  key: APP_VERSION
            - name: ELASTICSEARCH_URL
              valueFrom:
                configMapKeyRef:
                  name: itaap-digitalit-promosimulator-coreservice
                  key: ELASTICSEARCH_URL
            - name: SEND_TELEMETRY_DATA
              valueFrom:
                configMapKeyRef:
                  name: itaap-digitalit-promosimulator-coreservice
                  key: SEND_TELEMETRY_DATA
            - name: ELASTIC_INDEX_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: itaap-digitalit-promosimulator-coreservice
                  key: ELASTIC_INDEX_PREFIX
            - name: ELASTICSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: itaap-digitalit-promosimulator-coreservice-secrets
                  key: ELASTICSEARCH_USERNAME
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: itaap-digitalit-promosimulator-coreservice-secrets
                  key: ELASTICSEARCH_PASSWORD
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: Always
          resources:
            requests:
              memory: "256Mi"
            limits:
              memory: "512Mi"
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      restartPolicy: Always
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

---

apiVersion: v1
kind: Service
metadata:
  name: itaap-digitalit-promosimulator-coreservice-service
  namespace: {{deployNamespace}}
  labels:
    app: itaap-digitalit-promosimulator-coreservice
spec:
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 80
      targetPort: 9000
  selector:
    app: itaap-digitalit-promosimulator-coreservice

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: itaap-digitalit-promosimulator-coreservice
  namespace: {{deployNamespace}}
data:
  LOG_LEVEL_APP: "INFO"
  APP_ENV: "{{app_env}}"
  APP_VERSION: "{{app_version}}"
  SEND_TELEMETRY_DATA: "true"
  ELASTICSEARCH_URL: "{{elasticsearchUrl}}"
  ELASTIC_INDEX_PREFIX: "itaap-digitalit-promosimulator-coreservice"

---

apiVersion: v1
kind: Secret
metadata:
  name: itaap-digitalit-promosimulator-coreservice-secrets
  namespace: {{deployNamespace}}
type: Opaque
data:
  ELASTICSEARCH_USERNAME: "{{elasticsearchUsername}}"
  ELASTICSEARCH_PASSWORD: "{{elasticsearchPassword}}"